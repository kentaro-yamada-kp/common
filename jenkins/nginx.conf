# kykp.net 共通リバースプロキシ設定
# crane-rank (Port 3001) および generic-matching (Port 3000) をサブパスで配信

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP (Port 80) -> HTTPS (Port 443) リダイレクト
server {
    listen 80;
    listen [::]:80;
    server_name kykp.net www.kykp.net;

    # Let's Encrypt ACME Challenge用
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (Port 443) 設定
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kykp.net www.kykp.net;

    # SSL証明書設定
    ssl_certificate /etc/letsencrypt/live/kykp.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kykp.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 共通プロキシヘッダー
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;

    # crane-rank (https://kykp.net/crane-rank/)
    location /crane-rank/ {
        proxy_pass http://127.0.0.1:3001;
    }

    location = /crane-rank {
        return 301 /crane-rank/;
    }

    # generic-matching (https://kykp.net/generic-matching/)
    location /generic-matching/ {
        proxy_pass http://127.0.0.1:3000;
    }

    location = /generic-matching {
        return 301 /generic-matching/;
    }

    # ルートパス
    location / {
        return 404;
    }
}
